spring:
  application:
    name: toffCo
  threads:
    virtual:
      enabled: true
  flyway:
    baseline-on-migrate: true
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/toffco_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5674}
    username: ${RABBITMQ_USER:myuser}
    password: ${RABBITMQ_PASS:secret}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:chave_secreta_local_ssh}

server:
  port: 8081

evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8080}
    instance: ${EVOLUTION_API_INSTANCE:ToffCoBot}
    key: ${EVOLUTION_API_KEY:KeyExemplo_teste_naoVali_da}

whatsapp:
  session:
    ttl: ${WHATSAPP_SESSION_TTL:PT24H}

logging:
  level:
    com:
      site:
        toffCo: INFO