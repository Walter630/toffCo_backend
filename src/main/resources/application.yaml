spring:
  application:
    name: toffCo
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/toffco_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    # E-mail fica opcional enquanto não for usado.
    # Ao ativar, configure MAIL_USER e MAIL_PASS no ambiente.
    username: ${MAIL_USER:disabled@localhost}
    password: ${MAIL_PASS:disabled}

    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    test-connection: false
    default-encoding: UTF-8


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5674}
    username: ${RABBITMQ_USER:myuser}
    password: ${RABBITMQ_PASS:secret}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:chave_secreta_local_ssh}

server:
  port: 8081

toffco:
  gerente:
    email: ${TOFFCO_GERENTE_EMAIL:walterro465@gmail.com}
    whatsapp: ${TOFFCO_GERENTE_WHATSAPP:}

odoo:
  sync:
    enabled: ${ODOO_SYNC_ENABLED:false}

  invoice:
    enabled: ${ODOO_INVOICE_ENABLED:false}

  webhook:
    token: ${ODOO_WEBHOOK_TOKEN:token-webhook-local}

  base-url: ${ODOO_BASE_URL:https://toffbrasil.odoo.com}
  database: ${ODOO_DATABASE:toffbrasil}
  api-key: ${ODOO_API_KEY:local-disabled}

logging:
  level:
    com:
      site:
        toffCo: INFO
    org:
      hibernate:
        sql: DEBUG
        jdbc:
          bind: TRACE


