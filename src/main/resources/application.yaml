spring:
  application:
    name: toffCo
  threads:
    virtual:
      enabled: true
  flyway:
    baseline-on-migrate: true
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/toffco_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  docker:
    compose:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    # E-mail fica opcional enquanto não for usado.
    # Ao ativar, configure MAIL_USER e MAIL_PASS no ambiente.
    username: ${MAIL_USER:disabled@localhost}
    password: ${MAIL_PASS:disabled}

    properties:
      mail:
        debug: true
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    test-connection: false
    default-encoding: UTF-8


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5674}
    username: ${RABBITMQ_USER:myuser}
    password: ${RABBITMQ_PASS:secret}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false

  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:chave_secreta_local_ssh}

server:
  port: 8081

n8n:
  alert-webhook-url: ${N8N_ALERT_WEBHOOK_URL:https://walterdrx.app.n8n.cloud/webhook/toffco-events-v2}
  review-mode: ${N8N_REVIEW_MODE:false}
  webhook-secret: ${N8N_WEBHOOK_SECRET:}
  connect-timeout: ${N8N_CONNECT_TIMEOUT:PT1S}
  read-timeout: ${N8N_READ_TIMEOUT:PT2S}
  transport: ${N8N_TRANSPORT:webhook}

# ─── Evolution API (DESATIVADA — mantida pra rollback) ────────
# Se precisar voltar pra Evolution, descomente e comente o bloco acima.
evolution:
  api:
    url: ${EVOLUTION_API_URL:http://localhost:8080}
    instance: ${EVOLUTION_API_INSTANCE:Bot_toffBrasil}
    key: ${EVOLUTION_API_KEY:KeyExemplo_teste_naoVali_da}
    read-timeout: ${EVOLUTION_API_READ_TIMEOUT:PT8S}
    circuit:
      failure-threshold: ${EVOLUTION_API_CIRCUIT_FAILURE_THRESHOLD:5}
      open-duration: ${EVOLUTION_API_CIRCUIT_OPEN_DURATION:PT30S}

whatsapp:
  # ─── Bridge (Baileys direto) ────────────────────────────────
  # Substitui a Evolution API. O bridge roda como container Node.js
  # e se comunica direto com o WhatsApp via WebSocket.
  bridge:
    url: ${WHATSAPP_BRIDGE_URL:http://localhost:3100}
    secret: ${WHATSAPP_BRIDGE_SECRET:troque-por-um-segredo-forte}
    read-timeout: ${WHATSAPP_BRIDGE_READ_TIMEOUT:PT8S}
  simulation-enabled: ${WHATSAPP_SIMULATION_ENABLED:true}
  session:
    ttl: ${WHATSAPP_SESSION_TTL:PT24H}
  attendant-number: ${WHATSAPP_ATTENDANT_NUMBER:}
  # Números fixos que o bot NUNCA deve responder.
  # Configure no .env: WHATSAPP_BLOCKED_NUMBERS=553488560330,551199999999
  # Separe por vírgula, sem espaço. O Spring converte automaticamente para lista.
  blocked-numbers: ${WHATSAPP_BLOCKED_NUMBERS:}

odoo:
  sync:
    enabled: ${ODOO_SYNC_ENABLED:false}

  invoice:
    enabled: ${ODOO_INVOICE_ENABLED:false}

  webhook:
    token: ${ODOO_WEBHOOK_TOKEN:token-webhook-local}

  base-url: ${ODOO_BASE_URL:https://toffbrasil.odoo.com}
  database: ${ODOO_DATABASE:toffbrasil}
  api-key: ${ODOO_API_KEY}

logging:
  level:
    com:
      site:
        toffCo: INFO
    org:
      hibernate:
        sql: DEBUG
        jdbc:
          bind: TRACE


