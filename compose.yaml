services:

  # ─── Sua aplicação ───────────────────────────────────────
  toffco-app:
    build: .
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    networks:
      - app-network
    ports:
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/toffco_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=myuser
      - RABBITMQ_PASS=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WHATSAPP_SESSION_TTL=PT24H
      # Agora aponta pro bridge em vez da Evolution API
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:3100
      - WHATSAPP_BRIDGE_SECRET=${BRIDGE_SECRET:-troque-por-um-segredo-forte}
      - APP_UPLOAD_DIR=/app/uploads

  # ─── WhatsApp Bridge (Baileys direto) ───────────────────
  #
  # Substitui a Evolution API. Conecta direto no WhatsApp via WebSocket.
  # Na primeira execução, mostra QR code nos logs: docker logs -f whatsapp-bridge
  whatsapp-bridge:
    build: ./whatsapp-bridge
    container_name: whatsapp-bridge
    ports:
      - '3100:3100'
    volumes:
      # Persiste a sessão do WhatsApp — sem isso, pede QR toda vez que reinicia
      - whatsapp_auth:/app/auth_data
    environment:
      - BRIDGE_PORT=3100
      - BACKEND_WEBHOOK_URL=http://toffco-app:8081/api/webhook/whatsapp/receive
      - BRIDGE_SECRET=${BRIDGE_SECRET:-troque-por-um-segredo-forte}
      - AUTH_FOLDER=/app/auth_data
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy

  # ─── PostgresSQL ───────────────────────────────────────
  postgres:
    container_name: toffCo
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=toffco_db'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5435:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d toffco_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # ─── RabbitMQ ───────────────────────────────────────
  rabbitmq:
    image: 'rabbitmq:3-management'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5674:5672'
      - '15674:15672'
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────
  redis:
    image: 'redis:8-alpine'
    container_name: redis-toffco
    ports:
      - '6380:6379'
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # ─── Evolution API (DESATIVADA) ──────────────────────────
  #
  # Mantida comentada caso precise voltar atrás temporariamente.
  # Pode deletar esse bloco depois de confirmar que o bridge funciona.
  #
  # evolution-api:
  #   image: evoapicloud/evolution-api:v2.3.7
  #   container_name: evolution-api
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - DATABASE_ENABLED=true
  #     - DATABASE_PROVIDER=postgresql
  #     - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/toffco_db
  #     - SERVER_URL=http://evolution-api:8080
  #     - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
  #     - CACHE_REDIS_ENABLED=true
  #     - CACHE_REDIS_URI=redis://redis:6379/0
  #     - CACHE_REDIS_PREFIX_KEY=toffco
  #     - CACHE_REDIS_SAVE_INSTANCES=true
  #     - CACHE_LOCAL_ENABLED=false
  #     - WEBHOOK_GLOBAL_ENABLED=true
  #     - WEBHOOK_GLOBAL_URL=http://toffco-app:8081/webhook/whatsapp/receive
  #     - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
  #     - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
  #   networks:
  #     - app-network
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  whatsapp_auth:

networks:
  app-network:
    driver: bridge
