version: '3.9'
services:

  # ─── Sua aplicação ───────────────────────────────────────
  app:
    build: .
    ports:
      - '8080:8080'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
  # ─── PostgresSQL ───────────────────────────────────────
  postgres:
    container_name: toffCo
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=toffco_db'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5435:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d toffco_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # ─── RabbitMQ ───────────────────────────────────────
  rabbitmq:
    image: 'rabbitmq:3-management'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5674:5672'
      - '15674:15672'

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge